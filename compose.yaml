version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: solaris
      MYSQL_USER: solaris
      MYSQL_PASSWORD: solaris

    ports:
      - "3306:3306"

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-proot" ]
      interval: 5s
      retries: 10
      start_period: 5s
      timeout: 5s

    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - solaris-network



  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: keycloak-pitang-booster
    restart: always
    ports:
      - "8082:8080"
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/solaris?useSSL=false&allowPublicKeyRetrieval=true
      KC_DB_USERNAME: solaris
      KC_DB_PASSWORD: solaris

    depends_on:
      mysql:
        condition: service_healthy
    networks:
          - solaris-network
  app:
    build: .
    container_name: solaris-api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8085:8080"

    networks:
      - solaris-network
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - app

    networks:
      - solaris-network

  grafana:
      image: grafana/grafana:latest
      container_name: grafana
      restart: always

      ports:
        - "3000:3000"

      volumes:
        - grafana_data:/var/lib/grafana

      depends_on:
        - prometheus

      networks:
        - solaris-network

volumes:
  mysql_data:
      driver: local
  grafana_data:

networks:
  solaris-network:
    driver: bridge