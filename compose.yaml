version: '3.9'

services:

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: solaris
      MYSQL_USER: solaris
      MYSQL_PASSWORD: solaris

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - solaris-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.3

    container_name: keycloak

    restart: unless-stopped

    command: start-dev

    environment:
      KC_DB: mysql
      KC_DB_URL_HOST: mysql
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: solaris
      KC_DB_PASSWORD: solaris

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8081:8080"

    networks:
      - solaris-network

  app:
    build: .
    container_name: solaris-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/solaris?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: solaris
      SPRING_DATASOURCE_PASSWORD: solaris
      SPRING_PROFILES_ACTIVE: test

    ports:
      - "8080:8080"

    networks:
      - solaris-network

volumes:
  mysql_data:

networks:
  solaris-network:
    driver: bridge