spring:
    datasource:
      url: jdbc:mysql://localhost:3306/solaris_local?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
      username: root
      password: root
      driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
