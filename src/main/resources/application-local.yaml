spring:
  datasource:
    url: jdbc:mysql://mysql:3306/solaris?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: solaris
    password: solaris
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false

  flyway:
    enabled: false

logging:
  level:
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF