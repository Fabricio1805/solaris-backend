spring:
    application:
      name: solaris-backend

    profiles:
      active: test

    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: create #validate
      show-sql: false
      properties:
        hibernate:
          format_sql: true

    flyway:
      enabled: true
      locations: classpath:db/migration

springdoc:
    api-docs:
      path: /api-docs

    swagger-ui:
      path: /swagger
