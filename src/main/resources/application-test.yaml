spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  sql:
    init:
      mode: never

springdoc:
  api-docs:
    path: /api-docs

  swagger-ui:
    path: /swagger