spring:
    datasource:
      url: jdbc:mysql://hlg-db:3306/solaris_hlg?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
      database-platform: org.hibernate.dialect.MySQLDialect

    flyway:
      enabled: true

logging:
    level:
      root: INFO
